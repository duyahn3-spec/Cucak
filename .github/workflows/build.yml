      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          set +e

          ./gradlew clean assembleDebug --stacktrace > build.log 2>&1

          EXIT_CODE=$?

          echo "========== ALL COMPILER ERRORS =========="

          grep -n -E \
            "^[0-9]+:e:|^e: |error:|Unresolved reference|Cannot access|Type mismatch|Argument type mismatch|No value passed|Overload resolution ambiguity" \
            build.log | tail -200

          echo "========== SOURCE LOCATIONS =========="

          grep -n -E \
            "\.kt:[0-9]+:[0-9]+|\.java:[0-9]+:[0-9]+" \
            build.log | tail -200

          echo "========== GRADLE FAILURE =========="

          grep -n -E \
            "FAILURE:|What went wrong:|Caused by:|BUILD FAILED" \
            build.log | tail -100

          echo "========== LAST 100 LINES =========="

          tail -100 build.log

          exit $EXIT_CODE

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cucak-debug
          path: app/build/outputs/apk/debug/*.apk
