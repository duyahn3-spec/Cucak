name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          set +e
          ./gradlew clean assembleDebug --stacktrace > build.log 2>&1
          EXIT_CODE=$?

          echo "========== KOTLIN ERRORS =========="
          grep -n -E "^e: |^w: |error:|\.kt:[0-9]+:[0-9]+" build.log | tail -150

          echo "========== GRADLE FAILURE =========="
          grep -n -E "FAILURE:|What went wrong:|Caused by:|BUILD FAILED" build.log | tail -50

          echo "========== LAST 80 LINES =========="
          tail -80 build.log

          exit $EXIT_CODE

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cucak-debug
          path: app/build/outputs/apk/debug/*.apk
