- name: Build APK
  run: |
    set +e
    ./gradlew clean assembleDebug --stacktrace > build.log 2>&1
    EXIT_CODE=$?

    echo "========== LAST 150 LINES =========="
    tail -150 build.log

    echo "========== IMPORTANT ERRORS =========="
    grep -n -E "FAILURE:|What went wrong:|Caused by:|error:|Error:|BUILD FAILED" build.log | tail -100

    exit $EXIT_CODE
