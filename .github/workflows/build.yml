name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Build APK
        run: |
          set +e

          ./gradlew clean assembleDebug --stacktrace > build.log 2>&1

          EXIT_CODE=$?

          echo ""
          echo "========================================"
          echo "       ALL COMPILER ERRORS"
          echo "========================================"

          grep -n -E \
            "^[0-9]+:e:|^e: |error:|Unresolved reference|Cannot access|Type mismatch|Argument type mismatch|No value passed|Overload resolution ambiguity" \
            build.log | tail -200 || true

          echo ""
          echo "========================================"
          echo "       SOURCE LOCATIONS"
          echo "========================================"

          grep -n -E \
            "\.kt:[0-9]+:[0-9]+|\.java:[0-9]+:[0-9]+" \
            build.log | tail -200 || true

          echo ""
          echo "========================================"
          echo "       GRADLE FAILURE"
          echo "========================================"

          grep -n -E \
            "FAILURE:|What went wrong:|Caused by:|BUILD FAILED" \
            build.log | tail -100 || true

          echo ""
          echo "========================================"
          echo "       LAST 100 LINES"
          echo "========================================"

          tail -100 build.log

          exit $EXIT_CODE

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cucak-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
